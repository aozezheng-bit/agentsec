stages:
  - security

agentsec:
  stage: security
  image: python:3.12-slim
  variables:
    AGENTSEC_PROJECT_ROOT: "."
    AGENTSEC_POLICY_PATH: "policies/organization-policy-enforce-example.yaml"
    AGENTSEC_OUTPUT_DIR: ".agentsec-ci"
  before_script:
    - python -m pip install .
  script:
    - scripts/run-agentsec-ci.sh "$AGENTSEC_PROJECT_ROOT" "$AGENTSEC_POLICY_PATH" "$AGENTSEC_OUTPUT_DIR"
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - .agentsec-ci/agentsec-assessment.json
      - .agentsec-ci/agentsec-results.sarif
      - .agentsec-ci/agentsec-exit-code.txt
