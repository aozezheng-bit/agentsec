# P2-EXIT-02 Trusted CI Control Plane example.
#
# Mode A: the trust artifacts (Policy, Waivers, Qualified Gate Registry, and
# human qualification evidence) live in a separate protected security-policy
# repository and are checked out into their own directory. The target PR
# checkout never contains the evaluated Policy.
#
# Mode B: the expected Policy SHA-256 is supplied from a protected CI
# variable/secret (`vars.AGENTSEC_POLICY_SHA256` or an organization-level
# equivalent). Any digest mismatch fails closed with exit 3 before analysis.
#
# Required protections outside this file: CODEOWNERS plus branch protection on
# the security-policy repository, mandatory review for policy changes, and
# restricted write access to the protected CI variables. A repository-local
# Policy remains available only as the explicitly lower-trust
# `repository_local` mode documented in docs/trusted-ci.md.

name: AgentSec (trusted control plane)

on:
  pull_request:
  workflow_dispatch:
    inputs:
      project_root:
        description: Agent project root to scan
        required: false
        default: demos/release-agent/baseline

permissions:
  contents: read
  security-events: write

jobs:
  agentsec:
    name: Deterministic Agent security policy (trusted)
    runs-on: ubuntu-latest
    env:
      AGENTSEC_PROJECT_ROOT: ${{ inputs.project_root || vars.AGENTSEC_PROJECT_ROOT || 'demos/release-agent/baseline' }}
      AGENTSEC_POLICY_PATH: ${{ vars.AGENTSEC_POLICY_PATH || 'organization-policy-enforce-example.yaml' }}
      AGENTSEC_TRUST_ROOT: trust-root
      AGENTSEC_EXPECT_POLICY_SHA256: ${{ vars.AGENTSEC_POLICY_SHA256 || secrets.AGENTSEC_POLICY_SHA256 }}
      AGENTSEC_OUTPUT_DIR: .agentsec-ci
    steps:
      - name: Check out target source
        uses: actions/checkout@v5
        with:
          path: target

      - name: Check out trusted security policy repository
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.AGENTSEC_POLICY_REPOSITORY }}
          ref: ${{ vars.AGENTSEC_POLICY_REF }}
          path: trust-root
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install AgentSec
        working-directory: target
        run: python -m pip install .

      - name: Run AgentSec and preserve its decision
        id: agentsec_scan
        shell: bash
        working-directory: target
        env:
          AGENTSEC_TRUST_ROOT: ../trust-root
        run: |
          set +e
          scripts/run-agentsec-ci.sh \
            "../$AGENTSEC_PROJECT_ROOT" \
            "$AGENTSEC_POLICY_PATH" \
            "$AGENTSEC_OUTPUT_DIR"
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          if [[ -s "$AGENTSEC_OUTPUT_DIR/agentsec-results.sarif" ]]; then
            echo "sarif_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "sarif_ready=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload AgentSec reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentsec-trusted-reports
          path: target/.agentsec-ci/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload SARIF to code scanning
        if: >-
          always() &&
          steps.agentsec_scan.outputs.sarif_ready == 'true' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: target/.agentsec-ci/agentsec-results.sarif
          category: agentsec-trusted

      - name: Enforce the preserved AgentSec exit code
        if: always()
        shell: bash
        env:
          AGENTSEC_EXIT_CODE: ${{ steps.agentsec_scan.outputs.exit_code }}
        run: |
          case "$AGENTSEC_EXIT_CODE" in
            0)
              echo "AgentSec policy allows this change."
              ;;
            1)
              echo "::error::AgentSec found policy-blocking deterministic risk."
              exit 1
              ;;
            2)
              echo "::error::AgentSec coverage is incomplete; CI fails closed."
              exit 2
              ;;
            3)
              echo "::error::AgentSec trust verification or policy configuration failed."
              exit 3
              ;;
            4)
              echo "::error::AgentSec could not produce a required artifact."
              exit 4
              ;;
            5)
              echo "::error::Required AgentSec analysis failed."
              exit 5
              ;;
            64)
              echo "::error::AgentSec CLI usage is invalid."
              exit 64
              ;;
            *)
              echo "::error::Missing or unexpected AgentSec exit code: $AGENTSEC_EXIT_CODE"
              exit 5
              ;;
          esac
