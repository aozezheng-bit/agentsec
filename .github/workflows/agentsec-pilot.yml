name: AgentSec Internal Pilot

on:
  pull_request:
    paths:
      - '.github/workflows/agentsec-pilot.yml'
      - 'demos/release-agent/**'
      - 'pilots/internal-release-agent/**'
      - 'policies/**'
      - 'scripts/run-agentsec-ci.sh'
      - 'scripts/run-pilot.py'
      - 'src/agentsec/**'
      - 'testdata/safe/shell-explanation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    name: Replay internal Release Agent pilot
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install AgentSec
        run: python -m pip install .

      - name: Run pilot and preserve result
        id: pilot
        shell: bash
        run: |
          set +e
          python scripts/run-pilot.py \
            --agentsec "$(command -v agentsec)" \
            --output-dir .agentsec-pilot
          exit_code=$?
          set -e
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agentsec-internal-pilot
          path: .agentsec-pilot/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce pilot acceptance
        if: always()
        shell: bash
        env:
          PILOT_EXIT_CODE: ${{ steps.pilot.outputs.exit_code }}
        run: |
          if [[ "$PILOT_EXIT_CODE" != '0' ]]; then
            echo "::error::AgentSec internal pilot failed with exit $PILOT_EXIT_CODE."
            exit "${PILOT_EXIT_CODE:-5}"
          fi
          echo "AgentSec internal pilot passed."
