# Copy this file into an AgentSec-controlled pilot directory and replace the
# placeholder state paths with reviewed snapshots from one external Agent repo.
# The target repo and the protected Policy root are supplied to run-pilot.py,
# not discovered from this file or from scanned content.
format: agentsec-pilot-plan
schema_version: "0.1.0"
pilot_id: external-agent-project-pilot
project_name: External Agent Project Report-only Pilot
owner: replace-with-project-owner
evidence_mode: external_repository
security_reviewer: replace-with-independent-security-reviewer
minimum_scans: 20
minimum_pr_scans: 10
required_drills:
  - incomplete_coverage
  - risky_change
  - waiver_lifecycle
