[build-system]
requires = ["setuptools==84.0.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agentsec"
dynamic = ["version"]
description = "Evidence-backed security diagnostics for Agent configuration and instruction assets."
readme = "README.md"
requires-python = ">=3.12"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
authors = [
  { name = "AgentSec Contributors" },
]
keywords = ["agent", "ai-security", "security-scanner", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "markdown-it-py>=4,<5",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.3,<7",
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
agentsec = "agentsec.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.package-data]
agentsec = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "agentsec.versioning.PACKAGE_VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]
extend-exclude = [
  "build",
  "testdata",
  "demos/release-agent/malformed",
  "demos/release-agent-zh/malformed",
  "demos/capability-drift-agent/incomplete",
  "demos/capability-drift-agent-zh/incomplete",
]

[tool.ruff.lint]
select = [
  "B",
  "E",
  "F",
  "I",
  "SIM",
  "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "-ra",
]
testpaths = ["tests"]
